services:
  support-triage-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8001:8001"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SQLITE_DIR: /app/data
    volumes:
      - support_triage_data:/app/data
    restart: unless-stopped

  support-triage-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://support-triage-api:8001
    depends_on:
      - support-triage-api
    restart: unless-stopped

volumes:
  support_triage_data:

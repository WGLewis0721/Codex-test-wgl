services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  support-triage-api:
    build:
      context: ./agents/support-triage
      dockerfile: Dockerfile.api
    ports:
      - "8001:8001"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SQLITE_DIR: /app/data
    volumes:
      - support_triage_data:/app/data
      - ./shared:/app/shared
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  support-triage-ui:
    build:
      context: ./agents/support-triage
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://support-triage-api:8001
    depends_on:
      - support-triage-api
    restart: unless-stopped

  knowledge-copilot-api:
    build:
      context: ./agents/knowledge-copilot
      dockerfile: Dockerfile.api
    ports:
      - "8002:8002"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
